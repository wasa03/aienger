<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}業務効率化ツール{% endblock %}</title>
  <style>
    :root {
      --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #6b7280;
      --line: #e3e6eb; --accent: #2d6cdf; --accent-soft: #e8f0fd;
      --ok: #1f8a4c; --ok-soft: #e7f6ed; --err: #c0392b; --err-soft: #fdecea;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161b; --panel: #1d2027; --text: #e7e9ee; --muted: #9aa1ad;
        --line: #2e323b; --accent: #6c9cf0; --accent-soft: #23304a;
        --ok: #5cc98a; --ok-soft: #1b3326; --err: #f08174; --err-soft: #3a2220;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      font-size: 15px; line-height: 1.6;
    }
    .layout { display: flex; min-height: 100vh; }
    nav {
      width: 220px; flex-shrink: 0; background: var(--panel);
      border-right: 1px solid var(--line); padding: 20px 12px;
    }
    nav .brand { font-weight: 700; padding: 0 10px 16px; }
    nav a {
      display: block; padding: 8px 10px; border-radius: 8px;
      color: var(--text); text-decoration: none; margin-bottom: 2px;
    }
    nav a:hover { background: var(--bg); }
    nav a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    main { flex: 1; padding: 32px 40px; max-width: 760px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .lead { color: var(--muted); margin: 0 0 24px; }
    .card {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 12px; padding: 24px; margin-bottom: 20px;
    }
    /* フォームと結果(全ツール共通) */
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    .field { margin-bottom: 18px; }
    .row { display: flex; gap: 16px; flex-wrap: wrap; }
    .row .field { flex: 1; min-width: 180px; }
    input {
      width: 100%; padding: 10px 12px; font-size: 15px; border-radius: 8px;
      border: 1px solid var(--line); background: var(--bg); color: var(--text);
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    button {
      font-size: 15px; font-weight: 600; border: none; border-radius: 8px;
      padding: 11px 22px; cursor: pointer; background: var(--accent); color: #fff;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .hint { color: var(--muted); font-size: 13px; margin-top: 10px; }
    .result { border-color: var(--ok); background: var(--ok-soft); }
    .result h2 { font-size: 16px; margin: 0 0 14px; color: var(--ok); }
    .error { border-color: var(--err); background: var(--err-soft); color: var(--err); }
    .item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
    .item:first-of-type { border-top: none; }
    .item .k { width: 96px; flex-shrink: 0; color: var(--muted); font-size: 13px; }
    .item .v { flex: 1; font-weight: 600; word-break: break-all; }
    .item .v a { color: var(--accent); }
    .copy {
      background: var(--panel); color: var(--text); border: 1px solid var(--line);
      padding: 6px 12px; font-size: 13px; font-weight: 500;
    }
    .copy.done { color: var(--ok); border-color: var(--ok); }
    .copy-all { margin-top: 14px; }
    @media (max-width: 720px) {
      .layout { flex-direction: column; }
      nav { width: auto; border-right: none; border-bottom: 1px solid var(--line); padding: 12px 16px; }
      main { padding: 20px 16px; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <div class="layout">
    <nav>
      <div class="brand">🛠️ 業務効率化ツール</div>
      {% for t in tools %}
        <a href="{{ url_for(t.endpoint) }}" class="{% if request.endpoint == t.endpoint %}active{% endif %}">
          {{ t.icon }} {{ t.name }}
        </a>
      {% endfor %}
    </nav>
    <main>{% block content %}{% endblock %}</main>
  </div>
  <script>
    // 送信中はボタンを押せなくする
    document.querySelectorAll("form[data-busy]").forEach((f) => {
      f.addEventListener("submit", () => {
        const b = f.querySelector("button[type=submit]");
        b.disabled = true;
        b.textContent = f.dataset.busy;
      });
    });
    // コピーボタン
    document.querySelectorAll(".copy").forEach((b) => {
      b.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(b.dataset.copy);
          const label = b.textContent;
          b.textContent = "コピーしました";
          b.classList.add("done");
          setTimeout(() => { b.textContent = label; b.classList.remove("done"); }, 1500);
        } catch (e) {
          alert("コピーできませんでした");
        }
      });
    });
  </script>
</body>
</html>
